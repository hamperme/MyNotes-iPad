name: MyNotesRegression
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGNING_ALLOWED: NO
    COMPILER_INDEX_STORE_ENABLE: NO
targets:
  MyNotes:
    type: application
    platform: iOS
    sources: [../MyNotes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mynotes.editor.regression
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  MyNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EditorRegressionTests.swift]
    dependencies:
      - target: MyNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MyNotes:
    build:
      targets:
        MyNotes: all
        MyNotesTests: [test]
    test:
      targets: [MyNotesTests]
